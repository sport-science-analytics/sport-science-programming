<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="'Hanken Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif">
  <!-- Axis limits and ticks, drawn in the course's own palette: warm neutrals, one red accent. -->
  <rect x="0" y="0" width="860" height="330" fill="#ffffff"/>

  <!-- Panel 1: chosen limits and ticks -->
  <rect x="20" y="20" width="820" height="172" rx="14" fill="#ffffff" stroke="#ece8e2" stroke-width="1"/>
  <text x="44" y="47" fill="#837d75" font-size="11" font-weight="700" letter-spacing="1.1">WITH CHOSEN LIMITS AND TICKS</text>
  <rect x="44" y="56" width="474" height="24" rx="6" fill="#f4f2ef"/>
  <text x="54" y="72" fill="#2b2825" font-size="12.5" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">ax.set_xlim(0, 180)   ax.set_xticks([0, 30, 60, 90, 120, 150, 180])</text>

  <!-- limits bracket -->
  <line x1="90" y1="100" x2="790" y2="100" stroke="#c60c30" stroke-width="1.25"/>
  <line x1="90" y1="95" x2="90" y2="105" stroke="#c60c30" stroke-width="1.25"/>
  <line x1="790" y1="95" x2="790" y2="105" stroke="#c60c30" stroke-width="1.25"/>
  <rect x="330" y="88" width="220" height="22" rx="11" fill="#ffffff"/>
  <text x="440" y="103" text-anchor="middle" fill="#ac0a29" font-size="12" font-weight="600">Limits: the axis runs from 0 to 180</text>

  <!-- axis -->
  <line x1="90" y1="132" x2="790" y2="132" stroke="#2b2825" stroke-width="1.5"/>
  <g stroke="#2b2825" stroke-width="1.5">
    <line x1="90" y1="132" x2="90" y2="140"/>
    <line x1="206.7" y1="132" x2="206.7" y2="140"/>
    <line x1="323.3" y1="132" x2="323.3" y2="140"/>
    <line x1="440" y1="132" x2="440" y2="140"/>
    <line x1="556.7" y1="132" x2="556.7" y2="140"/>
    <line x1="673.3" y1="132" x2="673.3" y2="140"/>
    <line x1="790" y1="132" x2="790" y2="140"/>
  </g>
  <g fill="#45413c" text-anchor="middle" font-size="12.5">
    <text x="90" y="157">0</text>
    <text x="206.7" y="157">30</text>
    <text x="323.3" y="157">60</text>
    <text x="440" y="157">90</text>
    <text x="556.7" y="157">120</text>
    <text x="673.3" y="157">150</text>
    <text x="790" y="157">180</text>
  </g>
  <text x="440" y="179" text-anchor="middle" fill="#837d75" font-size="12">Time (s)</text>

  <!-- callouts -->
  <circle cx="323.3" cy="136" r="3.5" fill="none" stroke="#5f5952" stroke-width="1.25"/>
  <line x1="319" y1="138" x2="250" y2="170" stroke="#5f5952" stroke-width="1"/>
  <text x="244" y="174" text-anchor="end" fill="#45413c" font-size="12">Tick: a small mark on the axis</text>
  <circle cx="556.7" cy="153" r="9" fill="none" stroke="#5f5952" stroke-width="1.25"/>
  <line x1="566" y1="157" x2="606" y2="173" stroke="#5f5952" stroke-width="1"/>
  <text x="612" y="177" fill="#45413c" font-size="12">Tick label: the number at the tick</text>

  <!-- Panel 2: Matplotlib's own ticks -->
  <rect x="20" y="208" width="820" height="102" rx="14" fill="#faf9f7" stroke="#ece8e2" stroke-width="1"/>
  <text x="44" y="235" fill="#837d75" font-size="11" font-weight="700" letter-spacing="1.1">SAME LIMITS, TICKS LEFT TO MATPLOTLIB</text>
  <text x="816" y="235" text-anchor="end" fill="#b5ada3" font-size="12">a tick every 25 seconds</text>
  <line x1="90" y1="262" x2="790" y2="262" stroke="#837d75" stroke-width="1.5"/>
  <g stroke="#837d75" stroke-width="1.5">
    <line x1="90" y1="262" x2="90" y2="270"/>
    <line x1="187.2" y1="262" x2="187.2" y2="270"/>
    <line x1="284.4" y1="262" x2="284.4" y2="270"/>
    <line x1="381.7" y1="262" x2="381.7" y2="270"/>
    <line x1="478.9" y1="262" x2="478.9" y2="270"/>
    <line x1="576.1" y1="262" x2="576.1" y2="270"/>
    <line x1="673.3" y1="262" x2="673.3" y2="270"/>
    <line x1="770.6" y1="262" x2="770.6" y2="270"/>
  </g>
  <g fill="#837d75" text-anchor="middle" font-size="12.5">
    <text x="90" y="287">0</text>
    <text x="187.2" y="287">25</text>
    <text x="284.4" y="287">50</text>
    <text x="381.7" y="287">75</text>
    <text x="478.9" y="287">100</text>
    <text x="576.1" y="287">125</text>
    <text x="673.3" y="287">150</text>
    <text x="770.6" y="287">175</text>
  </g>
</svg>
