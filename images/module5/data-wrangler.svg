        <text x="248" y="354" fill="#999">5</text>
        <text x="278" y="354">2026-01-05</text><text x="372" y="354">Sander</text><text x="456" y="354">Bench Press</text>
        <text x="560" y="354">4</text><text x="612" y="354">5</text><text x="668" y="354">90.0</text><text x="790" y="354">8.0</text><text x="870" y="354">2.0</text>
      </g>
      <g>
        <rect x="238" y="366" width="722" height="34" fill="#ffffff"/>
        <text x="248" y="388" fill="#999">6</text>
        <text x="278" y="388">2026-01-05</text><text x="372" y="388">Sander</text><text x="456" y="388">Deadlift</text>
        <text x="560" y="388">3</text><text x="612" y="388">5</text><text x="668" y="388">160.0</text><text x="790" y="388">9.0</text><text x="870" y="388">1.0</text>
      </g>
      <g>
        <rect x="238" y="400" width="722" height="34" fill="#fafafa"/>
        <text x="248" y="422" fill="#999">7</text>
        <text x="278" y="422">2026-01-05</text><text x="372" y="422">Sander</text><text x="456" y="422">Pull-Up</text>
        <text x="560" y="422">3</text><text x="612" y="422">8</text>
        <rect x="664" y="406" width="40" height="22" rx="4" fill="#fef3c7"/><text x="668" y="422" fill="#b45309">NaN</text>
        <text x="790" y="422">6.0</text>
        <rect x="866" y="406" width="40" height="22" rx="4" fill="#fef3c7"/><text x="870" y="422" fill="#b45309">NaN</text>
      </g>
      <g>
        <rect x="238" y="434" width="722" height="34" fill="#ffffff"/>
        <text x="248" y="456" fill="#999">8</text>
        <text x="278" y="456">2026-01-08</text><text x="372" y="456">Emma</text><text x="456" y="456">Squat</text>
        <text x="560" y="456">4</text><text x="612" y="456">5</text><text x="668" y="456">97.5</text><text x="790" y="456">8.0</text><text x="870" y="456">2.0</text>
      </g>
      <g>
        <rect x="238" y="468" width="722" height="34" fill="#fafafa"/>
        <text x="248" y="490" fill="#999">9</text>
        <text x="278" y="490">2026-01-08</text><text x="372" y="490">Emma</text><text x="456" y="490">Bench Press</text>
        <text x="560" y="490">4</text><text x="612" y="490">5</text><text x="668" y="490">62.5</text><text x="790" y="490">7.5</text><text x="870" y="490">2.0</text>
