        <text x="278" y="252">2026-01-05</text><text x="372" y="252">Emma</text><text x="456" y="252">Deadlift</text>
        <text x="560" y="252">3</text><text x="612" y="252">5</text><text x="668" y="252">120.0</text><text x="790" y="252">8.5</text><text x="870" y="252">1.0</text>
