      <!-- Exercise -->
      <text x="456" y="112" fill="#222" font-weight="700">Exercise</text>
      <text x="456" y="126" fill="#777" font-size="10">string</text>
      <rect x="456" y="140" width="70" height="8" fill="#3b82f6"/>
      <text x="456" y="158" fill="#777" font-size="10">0% missing</text>

      <!-- Sets -->
      <text x="558" y="112" fill="#222" font-weight="700">Sets</text>
      <text x="560" y="126" fill="#777" font-size="10">int64</text>
      <rect x="560" y="140" width="50" height="8" fill="#3b82f6"/>
      <text x="560" y="158" fill="#777" font-size="10">0% missing</text>

