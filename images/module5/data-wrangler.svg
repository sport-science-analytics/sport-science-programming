<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <!-- Illustration of a Data Wrangler style DataFrame viewer inside a VS Code style window -->
  <defs>
    <clipPath id="win"><rect x="0" y="0" width="960" height="560" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect x="0" y="0" width="960" height="560" fill="#f3f3f3"/>

    <!-- title bar -->
    <rect x="0" y="0" width="960" height="34" fill="#dddddd"/>
    <circle cx="18" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="38" cy="17" r="6" fill="#febc2e"/>
    <circle cx="58" cy="17" r="6" fill="#28c840"/>
    <text x="480" y="21" text-anchor="middle" fill="#444" font-size="12">strength_log.csv - sport-science - Visual Studio Code</text>

    <!-- activity bar -->
    <rect x="0" y="34" width="48" height="526" fill="#2c2c2c"/>
    <g fill="none" stroke="#bbb" stroke-width="1.8">
      <rect x="15" y="52" width="18" height="18" rx="2"/>
      <circle cx="24" cy="102" r="8"/>
      <path d="M17 140 l14 0 M17 146 l14 0 M17 152 l14 0"/>
      <rect x="15" y="182" width="18" height="18" rx="9"/>
      <path d="M15 232 l18 0 l-9 12 z"/>
    </g>
    <rect x="12" y="270" width="24" height="24" rx="4" fill="#3b82f6"/>
    <text x="24" y="287" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">DW</text>

    <!-- side panel: operations -->
    <rect x="48" y="34" width="190" height="526" fill="#f8f8f8"/>
    <rect x="48" y="34" width="190" height="30" fill="#ececec"/>
    <text x="62" y="54" fill="#333" font-size="11" font-weight="700" letter-spacing="0.5">DATA WRANGLER</text>
    <text x="62" y="86" fill="#666" font-size="11" font-weight="700">OPERATIONS</text>
    <g fill="#333" font-size="12">
      <text x="72" y="110">Sort</text>
      <text x="72" y="132">Filter</text>
      <text x="72" y="154">Drop columns</text>
      <text x="72" y="176">Drop missing values</text>
      <text x="72" y="198">Fill missing values</text>
      <text x="72" y="220">Change column type</text>
      <text x="72" y="242">Group by and aggregate</text>
      <text x="72" y="264">Round values</text>
    </g>
    <text x="62" y="300" fill="#666" font-size="11" font-weight="700">CLEANING STEPS</text>
    <g fill="#333" font-size="12">
      <text x="72" y="324">1. Load strength_log.csv</text>
      <text x="72" y="346" fill="#999">(no steps yet)</text>
    </g>
    <text x="62" y="380" fill="#666" font-size="11" font-weight="700">SUMMARY</text>
    <g fill="#333" font-size="12">
      <text x="72" y="404">Rows: 288</text>
      <text x="72" y="426">Columns: 8</text>
      <text x="72" y="448">Missing cells: 105</text>
    </g>

    <!-- editor tab strip -->
    <rect x="238" y="34" width="722" height="30" fill="#ececec"/>
    <rect x="238" y="34" width="230" height="30" fill="#ffffff"/>
    <rect x="238" y="34" width="230" height="2" fill="#3b82f6"/>
    <text x="252" y="54" fill="#333" font-size="12">Data Wrangler: strength_log.csv</text>
    <text x="490" y="54" fill="#888" font-size="12">clean_data.py</text>

    <!-- toolbar -->
    <rect x="238" y="64" width="722" height="28" fill="#fafafa"/>
    <g fill="#444" font-size="11">
      <text x="252" y="82">Search columns</text>
      <text x="380" y="82">Rows 1 to 8 of 288</text>
      <text x="800" y="82">Export to notebook</text>
    </g>
    <rect x="345" y="70" width="1" height="16" fill="#ddd"/>

    <!-- grid area -->
    <rect x="238" y="92" width="722" height="468" fill="#ffffff"/>

    <!-- column headers with tiny summary bars -->
