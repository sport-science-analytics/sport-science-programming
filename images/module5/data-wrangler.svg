      <text x="612" y="126" fill="#777" font-size="10">int64</text>
      <rect x="612" y="140" width="50" height="8" fill="#3b82f6"/>
      <text x="612" y="158" fill="#777" font-size="10">0% missing</text>

      <!-- Added_Weight_kg -->
      <text x="668" y="112" fill="#222" font-weight="700">Added_Weight_kg</text>
      <text x="668" y="126" fill="#777" font-size="10">float64</text>
      <rect x="668" y="140" width="70" height="8" fill="#e5e7eb"/>
      <rect x="668" y="140" width="53" height="8" fill="#3b82f6"/>
