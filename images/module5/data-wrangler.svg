      <rect x="870" y="140" width="60" height="8" fill="#e5e7eb"/>
      <rect x="870" y="140" width="54" height="8" fill="#3b82f6"/>
      <text x="870" y="158" fill="#b45309" font-size="10">9% missing</text>
